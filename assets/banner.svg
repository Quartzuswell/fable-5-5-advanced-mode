<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#010409;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" style="stop-color:#a371f7;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#58a6ff;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#glow1)"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#glow2)"/>

  <!-- Decorative elements -->
  <circle cx="150" cy="80" r="120" fill="none" stroke="#58a6ff" stroke-opacity="0.06" stroke-width="1.5"/>
  <circle cx="1050" cy="290" r="160" fill="none" stroke="#a371f7" stroke-opacity="0.06" stroke-width="1.5"/>
  <circle cx="600" cy="180" r="250" fill="none" stroke="#58a6ff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Subtle top line -->
  <line x1="200" y1="60" x2="1000" y2="60" stroke="url(#line)" stroke-width="1"/>

  <!-- Decorative diamond shapes -->
  <polygon points="80,45 90,35 100,45 90,55" fill="#58a6ff" fill-opacity="0.08"/>
  <polygon points="1120,45 1130,35 1140,45 1130,55" fill="#58a6ff" fill-opacity="0.08"/>
  <polygon points="80,315 90,305 100,315 90,325" fill="#a371f7" fill-opacity="0.08"/>
  <polygon points="1120,315 1130,305 1140,315 1130,325" fill="#a371f7" fill-opacity="0.08"/>

  <!-- Small decorative dots -->
  <circle cx="200" cy="100" r="1.5" fill="#58a6ff" fill-opacity="0.2"/>
  <circle cx="950" cy="90" r="1.5" fill="#58a6ff" fill-opacity="0.2"/>
  <circle cx="300" cy="280" r="1.5" fill="#a371f7" fill-opacity="0.2"/>
  <circle cx="850" cy="270" r="1.5" fill="#a371f7" fill-opacity="0.2"/>
  <circle cx="1100" cy="140" r="1" fill="#58a6ff" fill-opacity="0.15"/>
  <circle cx="100" cy="200" r="1" fill="#a371f7" fill-opacity="0.15"/>

  <!-- Decorative path arcs -->
  <path d="M 100 300 Q 200 280 300 300" fill="none" stroke="#58a6ff" stroke-opacity="0.05" stroke-width="1"/>
  <path d="M 900 60 Q 1000 40 1100 60" fill="none" stroke="#a371f7" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Headline -->
  <text x="600" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="56.0" font-weight="700" fill="#ffffff">
    <tspan x="600" dy="0">Fable 5.5 Advanced Mode Unlocked</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20.0" font-weight="400" fill="#c9d1d9">
    <tspan x="600" dy="0">Fable 5.5 Advanced Mode companion for players who want deeper</tspan>
    <tspan x="600" dy="28">narrative control — unlock hidden dialogue bran…</tspan>
  </text>

  <!-- Bottom accent line -->
  <line x1="400" y1="280" x2="800" y2="280" stroke="url(#line)" stroke-width="1"/>
</svg>